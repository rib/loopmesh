[workspace]

[package]
name = "loopmesh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rib/loopmesh"

[features]
# Install a global allocator that counts alloc/dealloc events. Used by
# `cargo bench --features bench-allocs` to measure heap-allocation behaviour
# of mesh operations. Not enabled by default because instrumenting every
# allocation perturbs timing.
bench-allocs = []

[dependencies]
glam = "0.20"
slab = "0.4"
slotmap = "1.0"
bitflags = "1.3"
smallvec = "1.8"
bytemuck = { version = "1.8", features = ["derive"] }
anyhow = "1"
num = "0.4"
nub-mesh = { path = "../nub-mesh" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "storage_workloads"
harness = false
